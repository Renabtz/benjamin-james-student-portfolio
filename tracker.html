<main><div class="wrap">
<h1>Academic tracker</h1>
<p class="lead">Calculate your GPA and manage your tasks. Data stays in your browser.</p>
<section><h2>GPA calculator</h2><div class="card">
<div id="courses"></div>
<button class="btn alt" id="add-course" type="button">Add course</button>
<p><strong>GPA (5.0 scale): <span id="gpa">–</span></strong></p>
<p class="err" id="gpa-err" role="alert"></p></div></section>
<section><h2>Tasks and deadlines</h2><div class="card">
<label for="t-text">Task</label><input id="t-text">
<label for="t-date">Due date</label><input id="t-date" type="date">
<p class="err" id="t-err" role="alert"></p>
<button class="btn" id="add-task" type="button">Add task</button>
<ul class="tasks" id="task-list"></ul></div></section>
